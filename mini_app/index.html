<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Твой артист</title>
<style>
  /* цветовая гамма (как в первой версии визуала) */
  :root {
    --bg: #11203a;
    --panel: #1c2f52;
    --ink: #fff1e8;
    --accent: #ffcd75;
    --good: #38b764;
    --bad: #b13e53;
    --line: #2b4a7a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: "Courier New", ui-monospace, monospace;
    -webkit-font-smoothing: none;
  }
  #app {
    max-width: 340px; margin: 0 auto; min-height: 100%;
    display: flex; flex-direction: column; align-items: center;
    padding: 14px 12px 20px;
  }
  h1 {
    font-size: 14px; letter-spacing: 1px; text-transform: uppercase;
    margin: 4px 0 10px; color: var(--accent);
  }
  .screen {
    background: #0a1426;
    border: 4px solid #0c1d38;
    box-shadow: 0 0 0 2px #2b4a7a inset, 0 6px 0 #0a1830;
    border-radius: 10px; padding: 10px;
    width: 100%;
    display: flex; flex-direction: column; align-items: center;
  }
  #stage {
    width: 256px; height: 256px;
    image-rendering: pixelated;
    background: radial-gradient(circle at 50% 38%, #1d3a66 0%, #0a1426 70%);
    border: 3px solid #000;
  }
  .meta { display: flex; gap: 6px; margin: 10px 0 4px; flex-wrap: wrap; justify-content: center; }
  .chip {
    background: var(--panel); border: 2px solid var(--line);
    padding: 3px 7px; font-size: 11px; border-radius: 6px;
  }
  .chip b { color: var(--accent); }
  .mood { font-size: 11px; color: var(--good); margin-bottom: 6px; min-height: 14px; text-align: center; }
  .gender { display: flex; gap: 8px; margin: 6px 0; align-items: center; }
  .gender button {
    background: var(--panel); color: var(--ink); border: 2px solid var(--line);
    padding: 5px 10px; font-family: inherit; font-size: 11px; border-radius: 6px; cursor: pointer;
  }
  .gender button.active { background: var(--accent); color: var(--bg); }
  .gender .lbl { font-size: 10px; color: var(--good); }
  .stats { width: 100%; margin-top: 8px; display: flex; flex-direction: column; gap: 7px; }
  .stat { font-size: 11px; color: var(--ink); }
  .stat .row { display: flex; justify-content: space-between; margin-bottom: 2px; }
  .bar { height: 10px; background: #0a1426; border: 2px solid var(--line); border-radius: 3px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .hint { font-size: 9px; opacity: .6; margin-top: 12px; text-align: center; color: var(--good); }
  button.close {
    margin-top: 12px; background: var(--panel); color: var(--ink);
    border: 2px solid var(--line); padding: 7px 12px; font-family: inherit;
    font-size: 11px; border-radius: 6px; cursor: pointer;
  }
</style>
</head>
<body>
<div id="app">
  <h1>🎤 Твой артист</h1>
  <div class="screen">
    <canvas id="stage" width="64" height="64"></canvas>
    <div class="meta">
      <span class="chip">УР <b id="lvl">1</b></span>
      <span class="chip">XP <b id="xp">0</b></span>
      <span class="chip">🔥 <b id="streak">0</b></span>
    </div>
    <div class="mood" id="mood">…</div>
    <div class="gender">
      <span class="lbl">Пол:</span>
      <button id="gBoy">♂ Мальчик</button>
      <button id="gGirl">♀ Девочка</button>
    </div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="hint">Vocal Tamagotchi</div>
  <button class="close" id="closeBtn" style="display:none">Закрыть</button>
</div>

<script>
// ---------- цветная палитра (как в первой версии визуала) ----------
// 0 контур/глаза | 1 одежда | 2 кожа | 3 трава/листва | 4 волосы
// 5 микрофон/акцент | 6 рот | 7 щёчки | 8 блик/белок/ноты
const PAL = ["#1a1c2c", "#ef7d57", "#ffcd75", "#38b764",
             "#6b4226", "#41a6f6", "#b13e53", "#ff77a8", "#fff1e8"];
const cv = document.getElementById("stage");
const ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;

function px(x, y, c) { if (c == null) return; ctx.fillStyle = PAL[c]; ctx.fillRect(x, y, 1, 1); }
function rect(x, y, w, h, c) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) px(x + i, y + j, c); }
function disc(cx, cy, r, c) {
  for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++)
    if (x*x + y*y <= r*r) px(cx + x, cy + y, c);
}

// ---------- сцена: студия ----------
function drawStudio() {
  // фон — синий radial-gradient (как в первой версии)
  const g = ctx.createRadialGradient(32, 24, 4, 32, 32, 42);
  g.addColorStop(0, "#1d3a66"); g.addColorStop(1, "#0a1426");
  ctx.fillStyle = g; ctx.fillRect(0, 0, 64, 64);
  rect(0, 52, 64, 12, 0);             // пол (тёмный)
  rect(0, 52, 64, 1, 2);              // линия пола (светлая)
  // зеркало на стене (слева)
  rect(4, 9, 12, 15, 1); rect(5, 10, 10, 13, 5);
  // постер (справа вверху)
  rect(45, 5, 10, 12, 1); rect(46, 6, 8, 10, 2);
  px(49, 9, 8); px(49, 10, 8); px(50, 11, 8); // нотка на постере
  // растение в углу
  rect(3, 47, 7, 6, 1);               // горшок
  disc(6, 44, 3, 3); rect(5, 41, 3, 4, 3); // листва
  // микрофон на стойке (справа)
  rect(52, 29, 1, 23, 0);             // стойка
  rect(50, 51, 5, 2, 0);              // основание
  disc(52, 28, 3, 5);                 // головка (синяя)
  px(51, 27, 8); px(53, 27, 8);       // решётка блик
}

// ---------- персонаж (полный рост) ----------
function drawChar(cx, bob, gender, mood, singing, tears) {
  const y = bob;
  // ноги
  rect(cx - 4, 40 + y, 3, 10, 1); rect(cx + 1, 40 + y, 3, 10, 1);
  px(cx - 4, 49 + y, 0); px(cx - 3, 49 + y, 0); px(cx - 2, 49 + y, 0);
  px(cx + 1, 49 + y, 0); px(cx + 2, 49 + y, 0); px(cx + 3, 49 + y, 0);
  // туловище
  if (gender === "girl") {
    rect(cx - 5, 24 + y, 10, 12, 1);
    rect(cx - 6, 36 + y, 12, 5, 1);
  } else {
    rect(cx - 5, 24 + y, 10, 16, 1);
  }
  // руки
  rect(cx - 6, 26 + y, 2, 10, 1);
  if (singing) {
    px(cx + 5, 28 + y, 1); px(cx + 6, 29 + y, 1); px(cx + 7, 30 + y, 1);
    px(cx + 8, 30 + y, 1); px(cx + 9, 29 + y, 1);
  } else {
    rect(cx + 5, 26 + y, 2, 10, 1);
  }
  // шея
  rect(cx - 1, 22 + y, 2, 2, 2);
  // голова
  disc(cx, 16 + y, 6, 2);
  // волосы
  if (gender === "girl") {
    rect(cx - 6, 10 + y, 12, 3, 4);
    rect(cx - 6, 13 + y, 2, 9, 4); rect(cx + 4, 13 + y, 2, 9, 4);
    rect(cx - 1, 8 + y, 3, 2, 1);   // бант
  } else {
    rect(cx - 6, 10 + y, 12, 3, 4);
    rect(cx - 6, 10 + y, 2, 5, 4); rect(cx + 4, 10 + y, 2, 5, 4);
  }
  // лицо: глаза
  const blink = (Math.floor(perfNow / 240) % 17 === 0);
  if (blink) {
    px(cx - 3, 16 + y, 0); px(cx - 2, 16 + y, 0);
    px(cx + 2, 16 + y, 0); px(cx + 3, 16 + y, 0);
  } else {
    px(cx - 3, 16 + y, 0); px(cx + 3, 16 + y, 0);
  }
  // щёчки
  px(cx - 4, 18 + y, 7); px(cx + 4, 18 + y, 7);
  // рот
  if (singing) {
    disc(cx, 19 + y, 1, 6);            // открыт (поёт)
  } else if (mood === "sad") {
    px(cx - 1, 20 + y, 6); px(cx, 19 + y, 6); px(cx + 1, 20 + y, 6);
  } else {
    px(cx - 1, 19 + y, 6); px(cx, 19 + y, 6); px(cx + 1, 19 + y, 6);
  }
  // слёзы
  if (tears) {
    px(cx - 3, 18 + y, 5); px(cx - 3, 19 + y, 5);
    px(cx + 3, 18 + y, 5); px(cx + 3, 19 + y, 5);
  }
}

// ---------- интерактив: ноты и звёзды ----------
let notes = [];
let stars = [];
function spawnNote() {
  notes.push({ x: 50, y: 26, vy: -0.35, vx: -0.12 });
}
function drawNotes() {
  for (const n of notes) {
    n.x += n.vx; n.y += n.vy;
    px(Math.round(n.x), Math.round(n.y), 8);
    px(Math.round(n.x), Math.round(n.y) - 1, 8);
    px(Math.round(n.x) + 1, Math.round(n.y) - 1, 8);
  }
  notes = notes.filter(n => n.y > 4);
}
function spawnStars(cx) {
  for (let i = 0; i < 7; i++) {
    const a = (i / 7) * Math.PI * 2;
    stars.push({ x: cx + Math.round(Math.cos(a) * 12), y: 18 + Math.round(Math.sin(a) * 10), life: 90 });
  }
}
function drawStars() {
  for (const s of stars) {
    s.life--;
    const c = (s.life % 20 < 10) ? 8 : 2;
    px(s.x, s.y, c); px(s.x - 1, s.y, c); px(s.x + 1, s.y, c);
    px(s.x, s.y - 1, c); px(s.x, s.y + 1, c);
  }
  stars = stars.filter(s => s.life > 0);
}

// ---------- данные ----------
let perfNow = 0;
function parseData() {
  const def = { level: 1, xp: 0, streak: 0, tech: 20, health: 20, char: 20, theory: 20, event: "" };
  try {
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) {
      Object.assign(def, JSON.parse(tg.initDataUnsafe.start_param));
    }
  } catch (e) {}
  const q = new URLSearchParams(location.search);
  if ([...q.keys()].length) {
    for (const k of ["level","xp","streak","tech","health","char","theory"])
      if (q.has(k)) def[k] = Number(q.get(k));
    if (q.has("event")) def.event = q.get("event");
  }
  return def;
}
function getGender() {
  const q = new URLSearchParams(location.search);
  if (q.has("gender")) return q.get("gender") === "girl" ? "girl" : "boy";
  let g = null;
  try { g = localStorage.getItem("vt_gender"); } catch (e) {}
  return g === "girl" ? "girl" : "boy";
}
function setGender(g) {
  try { localStorage.setItem("vt_gender", g); } catch (e) {}
  document.getElementById("gBoy").classList.toggle("active", g === "boy");
  document.getElementById("gGirl").classList.toggle("active", g === "girl");
}
function moodFrom(d, forcedSad) {
  if (forcedSad || d.streak === 0) return "sad";
  if (d.streak >= 3 && d.level >= 3) return "proud";
  return "happy";
}
const MOOD_TEXT = {
  proud:  "✨ Гордость! Ты на коне.",
  happy:  "😊 Репетиция в полном разгаре.",
  sad:    "😢 Соскучился — заходи чаще!",
};

function render() {
  const d = parseData();
  const gender = getGender();
  setGender(gender);
  document.getElementById("lvl").textContent = d.level;
  document.getElementById("xp").textContent = d.xp;
  document.getElementById("streak").textContent = d.streak;

  const forcedSad = (d.event === "streak_lost");
  const mood = moodFrom(d, forcedSad);
  document.getElementById("mood").textContent = MOOD_TEXT[mood];

  const stats = [["🎶 Техника", d.tech], ["💚 Здоровье", d.health],
                 ["✨ Харизма", d.char], ["👂 Теория", d.theory]];
  const wrap = document.getElementById("stats");
  wrap.innerHTML = "";
  for (const [name, val] of stats) {
    const pct = Math.max(0, Math.min(100, val));
    const div = document.createElement("div");
    div.className = "stat";
    div.innerHTML = `<div class="row"><span>${name}</span><span>${pct}</span></div>` +
                    `<div class="bar"><i style="width:${pct}%"></i></div>`;
    wrap.appendChild(div);
  }

  document.getElementById("gBoy").onclick = () => setGender("boy");
  document.getElementById("gGirl").onclick = () => setGender("girl");

  let jumpUntil = 0, starUntil = 0;
  if (d.event === "lesson_done") starUntil = perfNow + 150;
  if (d.event === "level_up") { jumpUntil = perfNow + 120; starUntil = perfNow + 150; }

  let noteTimer = 0;
  function loop(ts) {
    perfNow = ts || 0;
    ctx.clearRect(0, 0, 64, 64);
    drawStudio();
    const cx = 30;
    let bob = Math.round(Math.sin(perfNow / 320) * 1.2);
    const jumping = perfNow < jumpUntil;
    if (jumping) bob -= Math.round(Math.abs(Math.sin(perfNow / 90)) * 5);
    const singing = (mood !== "sad") || d.event === "lesson_done" || d.event === "level_up";
    drawChar(cx, bob, gender, mood, singing, forcedSad);

    if (singing) {
      noteTimer++;
      if (noteTimer % 22 === 0) spawnNote();
    }
    drawNotes();
    if (perfNow < starUntil) { if (stars.length === 0) spawnStars(cx); }
    drawStars();

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}

try {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.expand(); tg.ready();
    const cb = document.getElementById("closeBtn");
    cb.style.display = "block";
    cb.onclick = () => tg.close();
  }
} catch (e) {}

render();
</script>
</body>
</html>
