<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Твой артист</title>
<style>
  :root {
    --bg: #11203a;
    --panel: #1c2f52;
    --ink: #fff1e8;
    --accent: #ffcd75;
    --good: #38b764;
    --bad: #b13e53;
    --line: #2b4a7a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: "Courier New", ui-monospace, monospace;
    -webkit-font-smoothing: none;
  }
  #app {
    max-width: 340px; margin: 0 auto; min-height: 100%;
    display: flex; flex-direction: column; align-items: center;
    padding: 14px 12px 20px;
  }
  h1 {
    font-size: 14px; letter-spacing: 1px; text-transform: uppercase;
    margin: 4px 0 10px; color: var(--accent);
  }
  .name-edit {
    background: transparent; border: none;
    border-bottom: 1px dashed var(--line);
    color: var(--accent); font: inherit; text-transform: uppercase;
    letter-spacing: 1px; width: 9.5em; text-align: center;
    padding: 0; outline: none;
  }
  .name-edit:focus { border-bottom-color: var(--accent); }
  .screen {
    background: #0a1426;
    border: 4px solid #0c1d38;
    box-shadow: 0 0 0 2px #2b4a7a inset, 0 6px 0 #0a1830;
    border-radius: 10px; padding: 10px;
    width: 100%;
    display: flex; flex-direction: column; align-items: center;
  }
  #stage {
    width: 256px; height: 256px;
    image-rendering: pixelated;
    background: #0a1426;
    border: 3px solid #000;
  }
  .meta { display: flex; gap: 6px; margin: 10px 0 4px; flex-wrap: wrap; justify-content: center; }
  .chip {
    background: var(--panel); border: 2px solid var(--line);
    padding: 3px 7px; font-size: 11px; border-radius: 6px;
  }
  .chip b { color: var(--accent); }
  .tier-lbl { font-size: 10px; color: var(--good); margin: 2px 0 4px; text-align: center; min-height: 14px; }
  .mood { font-size: 11px; color: var(--good); margin-bottom: 6px; min-height: 14px; text-align: center; }
  .section-lbl { font-size: 10px; color: var(--good); margin: 8px 0 3px; letter-spacing: .5px; }
  .gender { display: flex; gap: 8px; margin: 2px 0; align-items: center; justify-content: center; }
  .gender button {
    background: var(--panel); color: var(--ink); border: 2px solid var(--line);
    padding: 5px 10px; font-family: inherit; font-size: 11px; border-radius: 6px; cursor: pointer;
  }
  .gender button.active { background: var(--accent); color: var(--bg); }
  .swatch-row { display: flex; gap: 5px; align-items: center; margin: 3px 0; flex-wrap: wrap; justify-content: center; }
  .swatch-row .lbl { font-size: 10px; color: var(--good); width: 26px; text-align: left; }
  .swatch {
    width: 18px; height: 18px; border: 2px solid var(--line);
    border-radius: 4px; cursor: pointer; padding: 0;
  }
  .swatch.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .stats { width: 100%; margin-top: 8px; display: flex; flex-direction: column; gap: 7px; }
  .stat { font-size: 11px; color: var(--ink); }
  .stat .row { display: flex; justify-content: space-between; margin-bottom: 2px; }
  .bar { height: 10px; background: #0a1426; border: 2px solid var(--line); border-radius: 3px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .hint { font-size: 9px; opacity: .6; margin-top: 12px; text-align: center; color: var(--good); }
  button.close {
    margin-top: 12px; background: var(--panel); color: var(--ink);
    border: 2px solid var(--line); padding: 7px 12px; font-family: inherit;
    font-size: 11px; border-radius: 6px; cursor: pointer;
  }
  .meter { width: 100%; height: 10px; background: #0a1426; border: 2px solid var(--line); border-radius: 3px; overflow: hidden; margin: 4px 0; }
  .meter > i { display: block; height: 100%; width: 50%; background: var(--accent); transition: width .05s linear; }
</style>
</head>
<body>
<div id="app">
  <h1>🎤 <input id="nameInput" class="name-edit" maxlength="22" spellcheck="false" aria-label="Имя артиста" /></h1>
  <div class="screen">
    <canvas id="stage" width="64" height="64"></canvas>
    <div class="meta">
      <span class="chip">УР <b id="lvl">1</b></span>
      <span class="chip">XP <b id="xp">0</b></span>
      <span class="chip">🔥 <b id="streak">0</b></span>
    </div>
    <div class="tier-lbl" id="tierLbl"></div>
    <div class="mood" id="mood">…</div>

    <div class="section-lbl">Пол</div>
    <div class="gender">
      <button id="gBoy">♂ Мальчик</button>
      <button id="gGirl">♀ Девочка</button>
    </div>

    <div class="section-lbl">Цвет одежды</div>
    <div class="swatch-row"><span class="lbl">Верх</span><span id="topSwatches"></span></div>
    <div class="swatch-row"><span class="lbl">Низ</span><span id="botSwatches"></span></div>

    <div class="section-lbl">Звук</div>
    <div class="gender">
      <button id="sndOn">🔊 Вкл</button>
      <button id="sndOff">🔇 Выкл</button>
    </div>

    <div class="stats" id="stats"></div>

    <div class="section-lbl">🎙 Голос (v2, бета)</div>
    <div class="gender">
      <button id="singBtn">🎤 Спой ноту</button>
      <button id="stopBtn" style="display:none">⏹ Стоп</button>
    </div>
    <div class="mood" id="pitchOut">Микрофон ловит высоту твоего голоса.</div>
    <div class="meter"><i id="pitchMeter"></i></div>
  </div>
  <div class="hint">Vocal Tamagotchi</div>
  <button class="close" id="closeBtn" style="display:none">Закрыть</button>
</div>

<script>
// ============================================================
//  VOCAL TAMAGOTCHI — Mini App
//  Стиль: Game Dev Tycoon (псевдо-изометрия, room-as-progress)
//  Canvas 64x64, pixelated, процедурная отрисовка
// ============================================================

// ---------- палитра ----------
// 0 контур/глаза | 1 резерв | 2 кожа | 3 трава/листва
// 4 волосы | 5 микрофон/акцент | 6 рот | 7 щёчки | 8 блик/ноты/белок
const PAL = ["#1a1c2c", "#ef7d57", "#ffcd75", "#38b764",
             "#6b4226", "#41a6f6", "#b13e53", "#ff77a8", "#fff1e8"];

const SWATCHES = ["#ef7d57", "#41a6f6", "#38b764", "#b13e53",
                  "#ffcd75", "#ff77a8", "#6b4226", "#fff1e8"];
const DEF_TOP = "#ef7d57";
const DEF_BOT = "#41a6f6";

const cv = document.getElementById("stage");
const ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;

function col(c) { return (typeof c === "number") ? PAL[c] : c; }
function px(x, y, c) { if (c == null) return; x = Math.round(x); y = Math.round(y); ctx.fillStyle = col(c); ctx.fillRect(x, y, 1, 1); }
function rect(x, y, w, h, c) { const cc = col(c); x = Math.round(x); y = Math.round(y); for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) ctx.fillRect(x + i, y + j, 1, 1); }
function disc(cx_, cy_, r, c) {
  cx_ = Math.round(cx_); cy_ = Math.round(cy_); r = Math.round(r);
  for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++)
    if (x*x + y*y <= r*r) { ctx.fillStyle = col(c); ctx.fillRect(cx_ + x, cy_ + y, 1, 1); }
}

// ---------- система вех (milestones) ----------
// Tier 0: гараж/комната новичка
// Tier 1: репетиционная (xp>=100 || streak>=3)
// Tier 2: студия (xp>=500 || streak>=7)
// Tier 3: топ-студия (xp>=2000 || streak>=14)
const TIERS = [
  { name: "🏠 Своя комната",   minXP: 0,    minStreak: 0  },
  { name: "🎼 Репетиционная",  minXP: 100,  minStreak: 3  },
  { name: "🎧 Студия",         minXP: 500,  minStreak: 7  },
  { name: "🏆 Топ-студия",     minXP: 2000, minStreak: 14 },
];
function tierFromData(d) {
  let tier = 0;
  for (let i = 1; i < TIERS.length; i++) {
    if (d.xp >= TIERS[i].minXP || d.streak >= TIERS[i].minStreak) tier = i;
  }
  return tier;
}
function nextTierInfo(d) {
  const t = tierFromData(d);
  if (t >= TIERS.length - 1) return null;
  const next = TIERS[t + 1];
  const xpLeft = Math.max(0, next.minXP - d.xp);
  const streakLeft = Math.max(0, next.minStreak - d.streak);
  return { name: next.name, xpLeft, streakLeft };
}

// ---------- палитры комнат по tier ----------
const ROOM_PALETTES = [
  { // Tier 0: гараж
    wallTop: "#1a2845", wallMid: "#15203a", wallBot: "#101830",
    floor: "#2a2040", floorEdge: "#3a3050",
    trim: "#3b2d5c", accent: "#4a3a6e",
  },
  { // Tier 1: репетиционная
    wallTop: "#1d3a5a", wallMid: "#183050", wallBot: "#132848",
    floor: "#2a3050", floorEdge: "#3a4060",
    trim: "#3b5a8c", accent: "#4a6a9e",
  },
  { // Tier 2: студия
    wallTop: "#2a4050", wallMid: "#243a48", wallBot: "#1e3340",
    floor: "#2a3a48", floorEdge: "#3a4a58",
    trim: "#3b6080", accent: "#4a7090",
  },
  { // Tier 3: топ-студия
    wallTop: "#3a3550", wallMid: "#302a48", wallBot: "#282040",
    floor: "#3a3048", floorEdge: "#4a4058",
    trim: "#6b5a9c", accent: "#8a70b0",
  },
];

// ---------- псевдо-изометрия ----------
// Конвертируем grid-координаты (gx,gy) в экранные (sx,sy).
// Центр комнаты — (32, 34). Угол ~30°.
const ISO_TX = 32;  // центр X
const ISO_TY = 34;  // центр Y (сдвинут вниз — верх留给 стене)
const ISO_HW = 16;  // половина ширины ромба по X
const ISO_HH = 8;   // половина высоты ромба по Y
function isoX(gx, gy) { return ISO_TX + (gx - gy) * ISO_HW; }
function isoY(gx, gy) { return ISO_TY + (gx + gy) * ISO_HH; }

// ---------- отрисовка пола (ромб) ----------
function drawFloor(pal) {
  // ромб 4x4 в grid-координатах: от (-2,-2) до (2,2)
  // заполняем все точки где |gx|+|gy| <= 2
  for (let gx = -2; gx <= 2; gx++) {
    for (let gy = -2; gy <= 2; gy++) {
      if (Math.abs(gx) + Math.abs(gy) <= 2) {
        const sx = isoX(gx, gy);
        const sy = isoY(gx, gy);
        // плита 32x16 px (2*ISO_HW x 2*ISO_HH)
        // рисуем параллелограмм
        drawIsoTile(sx, sy, pal.floor);
      }
    }
  }
  // рёбра/контур
  drawFloorEdges(pal);
}
function drawIsoTile(cx, cy, fill) {
  ctx.fillStyle = fill;
  ctx.beginPath();
  ctx.moveTo(cx, cy - ISO_HH);
  ctx.lineTo(cx + ISO_HW, cy);
  ctx.lineTo(cx, cy + ISO_HH);
  ctx.lineTo(cx - ISO_HW, cy);
  ctx.closePath();
  ctx.fill();
}
function drawFloorEdges(pal) {
  // контур ромба — 4 стороны
  const corners = [
    [isoX(-2,0), isoY(-2,0)],  // задний левый
    [isoX(0,-2), isoY(0,-2)],  // задний правый
    [isoX(2,0),  isoY(2,0)],   // передний правый
    [isoX(0,2),  isoY(0,2)],   // передний левый
  ];
  // упрощаем: рисуем линии пола как пиксели
  for (let gx = -2; gx <= 2; gx++) {
    for (let gy = -2; gy <= 2; gy++) {
      if (Math.abs(gx) + Math.abs(gy) === 2) {
        // крайние плиты — рисуем обводку
        const sx = isoX(gx, gy);
        const sy = isoY(gx, gy);
        ctx.fillStyle = pal.floorEdge;
        // верхнее ребро
        ctx.fillRect(sx - 1, sy - ISO_HH, 1, 1);
        ctx.fillRect(sx + ISO_HW - 1, sy - 1, 1, 1);
      }
    }
  }
}

// ---------- отрисовка задней стены ----------
function drawBackWall(pal, tier) {
  // стена занимает верхнюю часть канваса
  // заливаем фон градиентом
  const g = ctx.createLinearGradient(0, 0, 0, 48);
  g.addColorStop(0, pal.wallTop);
  g.addColorStop(0.6, pal.wallMid);
  g.addColorStop(1, pal.wallBot);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 64, 40);

  // плинтус
  ctx.fillStyle = pal.trim;
  ctx.fillRect(0, 39, 64, 2);

  // декор стены зависит от tier
  if (tier >= 0) {
    // простая рамка/окно
    drawWindow(8, 6, pal);
  }
  if (tier >= 1) {
    // второе окно
    drawWindow(44, 6, pal);
    // полка
    drawShelf(3, 30, pal, false);
  }
  if (tier >= 2) {
    // золотой микрофон на полке
    drawShelf(3, 30, pal, true);
    // плакат
    drawPoster(48, 20, pal);
  }
  if (tier >= 3) {
    // платиновый диск
    drawPlatinumDisc(48, 5, pal);
    // аркадный автомат
    drawArcade(54, 30, pal);
  }
}

function drawWindow(x, y, pal) {
  // окно 12x10 с рамкой
  ctx.fillStyle = pal.trim;
  ctx.fillRect(x - 1, y - 1, 14, 12);
  // стекло
  ctx.fillStyle = "#2a4a6a";
  ctx.fillRect(x, y, 12, 10);
  // небо/закат
  ctx.fillStyle = "#41a6f6";
  ctx.fillRect(x, y, 12, 5);
  ctx.fillStyle = "#ffcd75";
  ctx.fillRect(x + 5, y + 2, 2, 2);  // солнце
  // перекладина
  ctx.fillStyle = pal.trim;
  ctx.fillRect(x + 5, y, 2, 10);
  ctx.fillRect(x, y + 4, 12, 1);
}

function drawShelf(x, y, pal, hasGoldMic) {
  // полка
  ctx.fillStyle = pal.trim;
  ctx.fillRect(x, y, 10, 2);
  ctx.fillRect(x, y + 2, 1, 6);
  ctx.fillRect(x + 9, y + 2, 1, 6);
  // книги/предметы
  const colors = ["#b13e53", "#41a6f6", "#38b764", "#ffcd75"];
  for (let i = 0; i < 4; i++) {
    ctx.fillStyle = colors[i];
    ctx.fillRect(x + 1 + i * 2, y - 4, 2, 4);
  }
  if (hasGoldMic) {
    // золотой микрофон на полке
    ctx.fillStyle = "#ffcd75";
    ctx.fillRect(x + 4, y - 8, 2, 4);
    disc(x + 5, y - 9, 2, "#ffcd75");
    ctx.fillStyle = "#1a1c2c";
    ctx.fillRect(x + 5, y - 10, 1, 1);  // блик
  }
}

function drawPoster(x, y, pal) {
  // постер на стене
  ctx.fillStyle = "#1a1c2c";
  ctx.fillRect(x - 1, y - 1, 12, 14);
  ctx.fillStyle = "#38b764";
  ctx.fillRect(x, y, 10, 12);
  // нотка на постере
  ctx.fillStyle = "#fff1e8";
  ctx.fillRect(x + 3, y + 3, 1, 5);
  ctx.fillRect(x + 3, y + 8, 3, 1);
  ctx.fillRect(x + 5, y + 4, 1, 4);
}

function drawPlatinumDisc(x, y, pal) {
  // диск в рамке на стене
  ctx.fillStyle = pal.trim;
  ctx.fillRect(x - 1, y - 1, 12, 12);
  disc(x + 5, y + 5, 5, "#fff1e8");
  disc(x + 5, y + 5, 4, "#c0c0d0");
  disc(x + 5, y + 5, 2, "#ffcd75");
  ctx.fillStyle = "#1a1c2c";
  ctx.fillRect(x + 5, y + 5, 1, 1);
}

function drawArcade(x, y, pal) {
  // маленький аркадный автомат
  ctx.fillStyle = "#1a1c2c";
  ctx.fillRect(x, y, 8, 10);
  ctx.fillStyle = "#b13e53";
  ctx.fillRect(x + 1, y + 1, 6, 5);
  ctx.fillStyle = "#41a6f6";
  ctx.fillRect(x + 2, y + 2, 4, 3);
  ctx.fillStyle = "#ffcd75";
  ctx.fillRect(x + 2, y + 7, 1, 1);
  ctx.fillRect(x + 5, y + 7, 1, 1);
  ctx.fillRect(x + 3, y + 7, 2, 1);
}

// ---------- мебель/объекты на полу (3-face) ----------
function drawFloorObject(gx, gy, kind, pal, lit) {
  const sx = isoX(gx, gy);
  const sy = isoY(gx, gy);
  // смещаем вниз, чтобы объект "стоял" на тайле
  const ox = sx, oy = sy + 2;

  if (kind === "mic") {
    // микрофон на стойке
    ctx.fillStyle = "#1a1c2c";
    ctx.fillRect(ox - 1, oy - 14, 1, 14);  // стойка
    ctx.fillRect(ox - 3, oy, 7, 1);         // основание
    disc(ox, oy - 15, 3, lit ? "#ffcd75" : "#41a6f6");  // головка
    if (lit) {
      // свечение
      px(ox - 1, oy - 16, "#fff1e8");
      px(ox + 1, oy - 16, "#fff1e8");
      px(ox, oy - 17, "#fff1e8");
    }
    px(ox - 1, oy - 16, "#fff1e8");  // блик
  } else if (kind === "plant") {
    // растение в горшке
    ctx.fillStyle = "#6b4226";
    ctx.fillRect(ox - 2, oy - 3, 5, 3);  // горшок
    ctx.fillStyle = "#38b764";
    ctx.fillRect(ox - 1, oy - 7, 3, 4);  // стебель
    disc(ox, oy - 8, 3, "#38b764");       // листва
    px(ox - 2, oy - 9, "#38b764");
    px(ox + 2, oy - 9, "#38b764");
    px(ox, oy - 11, "#38b764");
  } else if (kind === "speaker") {
    // колонка
    ctx.fillStyle = "#1a1c2c";
    ctx.fillRect(ox - 3, oy - 12, 6, 12);
    ctx.fillStyle = "#2a2a3c";
    ctx.fillRect(ox - 2, oy - 11, 4, 4);  // верхний динамик
    ctx.fillStyle = "#0a0a1c";
    disc(ox, oy - 9, 1, "#0a0a1c");
    ctx.fillStyle = "#2a2a3c";
    ctx.fillRect(ox - 2, oy - 5, 4, 4);   // нижний динамик
    disc(ox, oy - 3, 1, "#0a0a1c");
    if (lit) {
      px(ox - 2, oy - 9, "#ffcd75");
      px(ox + 2, oy - 9, "#ffcd75");
    }
  } else if (kind === "piano") {
    // синтезатор/пианино
    ctx.fillStyle = "#1a1c2c";
    ctx.fillRect(ox - 5, oy - 4, 11, 4);   // корпус
    ctx.fillStyle = "#2a2a3c";
    ctx.fillRect(ox - 5, oy - 5, 11, 1);   // панель
    ctx.fillStyle = "#fff1e8";
    for (let i = 0; i < 5; i++) {
      ctx.fillRect(ox - 4 + i * 2, oy - 4, 1, 2);  // клавиши
    }
    // чёрные клавиши
    ctx.fillStyle = "#1a1c2c";
    ctx.fillRect(ox - 3, oy - 4, 1, 1);
    ctx.fillRect(ox + 1, oy - 4, 1, 1);
    if (lit) {
      px(ox, oy - 6, "#ffcd75");
    }
  } else if (kind === "sofa") {
    // диван
    ctx.fillStyle = "#b13e53";
    ctx.fillRect(ox - 5, oy - 6, 11, 6);
    ctx.fillStyle = "#8a2e44";
    ctx.fillRect(ox - 5, oy - 6, 2, 6);    // левый подлокотник
    ctx.fillRect(ox + 4, oy - 6, 2, 6);    // правый подлокотник
    ctx.fillStyle = "#d15068";
    ctx.fillRect(ox - 3, oy - 5, 7, 2);    // подушки
    ctx.fillRect(ox - 3, oy - 2, 7, 2);
  } else if (kind === "lamp") {
    // торшер
    ctx.fillStyle = "#1a1c2c";
    ctx.fillRect(ox, oy - 12, 1, 12);      // стойка
    ctx.fillStyle = "#3a2a1c";
    ctx.fillRect(ox - 3, oy, 7, 1);         // основание
    ctx.fillStyle = lit ? "#ffcd75" : "#6b5226";
    // абажур (треугольник пикселями)
    ctx.fillRect(ox - 2, oy - 14, 5, 2);
    ctx.fillRect(ox - 1, oy - 15, 3, 1);
    if (lit) {
      // световое пятно
      px(ox - 3, oy - 13, "#ffcd75");
      px(ox + 3, oy - 13, "#ffcd75");
    }
  } else if (kind === "rug") {
    // ковёр на полу (рисуется как плоский изометрический тайл)
    ctx.fillStyle = "#b13e53";
    ctx.beginPath();
    ctx.moveTo(ox, oy - ISO_HH);
    ctx.lineTo(ox + ISO_HW, oy);
    ctx.lineTo(ox, oy + ISO_HH);
    ctx.lineTo(ox - ISO_HW, oy);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#ffcd75";
    ctx.fillRect(ox - 1, oy - 1, 2, 1);
  }
}

// ---------- объекты по tier ----------
function getFloorObjects(tier) {
  // всегда есть микрофон и растение
  const objs = [
    { gx: 1,  gy: 1,  kind: "mic",   lit: false },
    { gx: -1, gy: 1,  kind: "plant", lit: false },
  ];
  if (tier >= 1) {
    objs.push({ gx: -1, gy: -1, kind: "speaker", lit: false });
    objs.push({ gx: 0,  gy: 0,  kind: "rug",    lit: false });
  }
  if (tier >= 2) {
    objs.push({ gx: 1,  gy: -1, kind: "piano",  lit: false });
    objs.push({ gx: -1, gy: 0,  kind: "lamp",   lit: false });
  }
  if (tier >= 3) {
    objs.push({ gx: 0,  gy: -1, kind: "sofa",   lit: false });
    // апгрейдим микрофон до золотого
    objs[0].lit = true;
  }
  return objs;
}

// ---------- подход к микрофону (активация) ----------
// Герой циклически подходит к микрофону и "поёт"
function getHeroApproach(perfNow, tier) {
  // цикл 6 секунд: 0-3s у микрофона (поёт), 3-4.5s отходит, 4.5-6s возвращается
  const cycle = 6000;
  const phase = (perfNow % cycle) / cycle;
  if (phase < 0.5) {
    // у микрофона
    return { atMic: true, offsetX: 0, singing: true };
  } else if (phase < 0.75) {
    // отошёл — к пианино/колонке
    return { atMic: false, offsetX: -8, singing: false };
  } else {
    // возвращается
    const t = (phase - 0.75) / 0.25;
    return { atMic: false, offsetX: -8 + Math.round(t * 8), singing: false };
  }
}

// ---------- звук (Web Audio, опционально) ----------
// Герой «поёт» нотами до-мажорной гаммы через синтез oscillator (без файлов).
let audioCtx = null;
let soundOn = (lsGet("vt_sound", "off") === "on");
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}
function playNote(freq, dur) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = "triangle";
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.15, audioCtx.currentTime + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start();
  o.stop(audioCtx.currentTime + dur);
}
const SCALE = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];
let soundTimer = 0;
function maybeSing() {
  if (!soundOn) return;
  ensureAudio();
  if (!audioCtx) return;
  soundTimer++;
  if (soundTimer % 26 === 0) {
    const f = SCALE[Math.floor(Math.random() * SCALE.length)];
    playNote(f, 0.35);
  }
}
function markSound() {
  document.getElementById("sndOn").classList.toggle("active", soundOn);
  document.getElementById("sndOff").classList.toggle("active", !soundOn);
}

// ---------- v2: голосовой анализ (питч-детекция) ----------
// Мини-игра «Спой ноту»: ловим высоту голоса с микрофона (Web Audio
// AnalyserNode + автокорреляция) и сравниваем с целевой нотой в центах.
// Пока локально (счёт в Mini App); бэкенд-хук — следующий шаг.
let micStream = null, analyser = null, micData = null;
let singingGame = false, targetMidi = 60, gameScore = 0, gameRounds = 0;
const A4 = 440;
function midiToFreq(m) { return A4 * Math.pow(2, (m - 69) / 12); }
function freqToMidi(f) { return 69 + 12 * Math.log2(f / A4); }
const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
function noteName(m) { const r = Math.round(m); return NOTE_NAMES[((r % 12) + 12) % 12] + (Math.floor(r / 12) - 1); }
function centsOff(freq, target) { return 1200 * Math.log2(freq / target); }
// автокорреляция (ACF) — классический алгоритм детекции основного тона
function autoCorrelate(buf, sr) {
  let SIZE = buf.length;
  let rms = 0;
  for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / SIZE);
  if (rms < 0.01) return -1; // слишком тихо — фон
  let r1 = 0, r2 = SIZE - 1, thres = 0.2;
  for (let i = 0; i < SIZE / 2; i++) { if (Math.abs(buf[i]) < thres) { r1 = i; break; } }
  for (let i = 1; i < SIZE / 2; i++) { if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; } }
  buf = buf.slice(r1, r2); SIZE = buf.length;
  const c = new Array(SIZE).fill(0);
  for (let i = 0; i < SIZE; i++)
    for (let j = 0; j < SIZE - i; j++) c[i] += buf[j] * buf[j + i];
  let d = 0;
  while (d < SIZE - 1 && c[d] > c[d + 1]) d++;
  let maxval = -1, maxpos = -1;
  for (let i = d; i < SIZE; i++) { if (c[i] > maxval) { maxval = c[i]; maxpos = i; } }
  let T0 = maxpos;
  // параболическая интерполяция для точности
  const x1 = c[T0 - 1] || 0, x2 = c[T0], x3 = c[T0 + 1] || 0;
  const a = (x1 + x3 - 2 * x2) / 2, b = (x3 - x1) / 2;
  if (a) T0 = T0 - b / a;
  return sr / T0;
}
function newRound() {
  targetMidi = 60 + Math.floor(Math.random() * 13); // C4..C5
  const tf = midiToFreq(targetMidi);
  const out = document.getElementById("pitchOut");
  if (out) out.textContent = "Спой: " + noteName(targetMidi) + " (" + Math.round(tf) + " Гц)";
}
async function startSing() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    const out = document.getElementById("pitchOut");
    if (out) out.textContent = "🎤 Микрофон не поддерживается в этом окружении.";
    return;
  }
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    ensureAudio();
    if (!audioCtx) { document.getElementById("pitchOut").textContent = "🎤 Аудио-контекст недоступен."; return; }
    if (audioCtx.state === "suspended") await audioCtx.resume();
    const src = audioCtx.createMediaStreamSource(micStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    src.connect(analyser);
    micData = new Float32Array(analyser.fftSize);
    singingGame = true;
    gameScore = 0; gameRounds = 0;
    document.getElementById("singBtn").style.display = "none";
    document.getElementById("stopBtn").style.display = "block";
    newRound();
    requestAnimationFrame(pitchLoop);
  } catch (e) {
    const out = document.getElementById("pitchOut");
    if (out) out.textContent = "🎤 Нет доступа к микрофону: " + (e && e.message ? e.message : e);
  }
}
function pitchLoop() {
  if (!singingGame || !analyser) return;
  analyser.getFloatTimeDomainData(micData);
  const f = autoCorrelate(micData, audioCtx.sampleRate);
  if (f > 0) {
    const cents = centsOff(f, midiToFreq(targetMidi));
    const w = Math.max(0, Math.min(100, 50 + cents)); // 50% = в строю
    const meter = document.getElementById("pitchMeter");
    if (meter) meter.style.width = w + "%";
    const out = document.getElementById("pitchOut");
    if (out) out.textContent = "Слышу: " + noteName(freqToMidi(f)) +
      " · " + (cents >= 0 ? "+" : "") + Math.round(cents) + " ¢";
    if (Math.abs(cents) < 35) { // попал в ноту
      gameScore++; gameRounds++;
      spawnStars(30);
      newRound();
    }
  }
  requestAnimationFrame(pitchLoop);
}
function stopSing() {
  singingGame = false;
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  const sb = document.getElementById("singBtn"); if (sb) sb.style.display = "block";
  const xb = document.getElementById("stopBtn"); if (xb) xb.style.display = "none";
  const out = document.getElementById("pitchOut");
  if (out) out.textContent = "Счёт: " + gameScore + " / " + gameRounds + " попаданий";
}

// ---------- данные и состояние кастомизации ----------
let perfNow = 0;
function parseData() {
  const def = { level: 1, xp: 0, streak: 0, tech: 20, health: 20, char: 20, theory: 20, event: "", acc: [] };
  try {
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) {
      const o = JSON.parse(tg.initDataUnsafe.start_param);
      Object.assign(def, o);
      if (typeof o.acc === "string") def.acc = o.acc.split(",").filter(Boolean);
    }
  } catch (e) {}
  const q = new URLSearchParams(location.search);
  if ([...q.keys()].length) {
    for (const k of ["level", "xp", "streak", "tech", "health", "char", "theory"])
      if (q.has(k)) def[k] = Number(q.get(k));
    if (q.has("event")) def.event = q.get("event");
    if (q.has("acc")) def.acc = q.get("acc").split(",").filter(Boolean);
    if (q.has("gender")) def.gender = q.get("gender");
  }
  if (typeof def.acc === "string") def.acc = def.acc.split(",").filter(Boolean);
  return def;
}
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

function getGender() {
  const q = new URLSearchParams(location.search);
  if (q.has("gender")) return q.get("gender") === "girl" ? "girl" : "boy";
  return lsGet("vt_gender", "boy") === "girl" ? "girl" : "boy";
}
function setGender(g) {
  lsSet("vt_gender", g);
  document.getElementById("gBoy").classList.toggle("active", g === "boy");
  document.getElementById("gGirl").classList.toggle("active", g === "girl");
}
function getTop() { return lsGet("vt_top", DEF_TOP); }
function setTop(c) {
  lsSet("vt_top", c);
  markSwatch("topSwatches", c);
}
function getBot() { return lsGet("vt_bot", DEF_BOT); }
function setBot(c) {
  lsSet("vt_bot", c);
  markSwatch("botSwatches", c);
}

function buildSwatches() {
  for (const id of ["topSwatches", "botSwatches"]) {
    const wrap = document.getElementById(id);
    wrap.innerHTML = "";
    for (const c of SWATCHES) {
      const b = document.createElement("button");
      b.className = "swatch";
      b.style.background = c;
      b.dataset.color = c;
      b.onclick = () => { (id === "topSwatches" ? setTop : setBot)(c); };
      wrap.appendChild(b);
    }
  }
}
function markSwatch(id, c) {
  const wrap = document.getElementById(id);
  for (const b of wrap.children) b.classList.toggle("active", b.dataset.color === c);
}

function moodFrom(d, forcedSad) {
  if (forcedSad || d.streak === 0) return "sad";
  if (d.streak >= 3 && d.level >= 3) return "proud";
  return "happy";
}
const MOOD_TEXT = {
  proud:  "✨ Гордость! Ты на коне.",
  happy:  "😊 Репетиция в полном разгаре.",
  sad:    "😢 Соскучился — заходи чаще!",
};

// эмоция в зависимости от настроения и фазы
function emotionFor(mood, approach, perfNow) {
  if (mood === "sad") return "tired";
  if (approach.atMic && approach.singing) return "note";
  if (!approach.atMic) return "idea";
  return "happy";
}

// аксессуары, разблокируемые по tier
function accForTier(tier) {
  const acc = [];
  if (tier >= 1) acc.push("cap");
  if (tier >= 2) acc.push("glasses");
  if (tier >= 3) acc.push("goldchain");
  return acc;
}

// ---------- главный рендер ----------
function render() {
  const d = parseData();
  const gender = getGender();
  const top = getTop();
  const bot = getBot();
  setGender(gender);
  markSwatch("topSwatches", top);
  markSwatch("botSwatches", bot);

  document.getElementById("lvl").textContent = d.level;
  document.getElementById("xp").textContent = d.xp;
  document.getElementById("streak").textContent = d.streak;

  const tier = tierFromData(d);
  document.getElementById("tierLbl").textContent = TIERS[tier].name;

  const forcedSad = (d.event === "streak_lost");
  const mood = moodFrom(d, forcedSad);
  document.getElementById("mood").textContent = MOOD_TEXT[mood];

  const stats = [["🎶 Техника", d.tech], ["💚 Здоровье", d.health],
                 ["✨ Харизма", d.char], ["👂 Теория", d.theory]];
  const wrap = document.getElementById("stats");
  wrap.innerHTML = "";
  for (const [name, val] of stats) {
    const pct = Math.max(0, Math.min(100, val));
    const div = document.createElement("div");
    div.className = "stat";
    div.innerHTML = `<div class="row"><span>${name}</span><span>${pct}</span></div>` +
                    `<div class="bar"><i style="width:${pct}%"></i></div>`;
    wrap.appendChild(div);
  }

  document.getElementById("gBoy").onclick = () => setGender("boy");
  document.getElementById("gGirl").onclick = () => setGender("girl");

  document.getElementById("sndOn").onclick = () => { soundOn = true; lsSet("vt_sound", "on"); ensureAudio(); markSound(); };
  document.getElementById("sndOff").onclick = () => { soundOn = false; lsSet("vt_sound", "off"); markSound(); };
  const sb = document.getElementById("singBtn"); if (sb) sb.onclick = startSing;
  const xb = document.getElementById("stopBtn"); if (xb) xb.onclick = stopSing;
  markSound();

  // объединяем аксессуары из данных и из tier
  const tierAcc = accForTier(tier);
  const dataAcc = Array.isArray(d.acc) ? d.acc : [];
  const acc = [...new Set([...tierAcc, ...dataAcc])];

  let jumpUntil = 0, starUntil = 0;
  if (d.event === "lesson_done") starUntil = perfNow + 150;
  if (d.event === "level_up") { jumpUntil = perfNow + 120; starUntil = perfNow + 150; }

  const pal = ROOM_PALETTES[tier];
  const floorObjects = getFloorObjects(tier);

  let noteTimer = 0;
  function loop(ts) {
    perfNow = ts || 0;
    const gender = getGender();   // читаем актуальные значения каждый кадр
    const top = getTop();
    const bot = getBot();
    ctx.clearRect(0, 0, 64, 64);

    // 1. Задняя стена
    drawBackWall(pal, tier);

    // 2. Пол (изометрический ромб)
    drawFloor(pal);

    // 3. Объекты на полу (сортируем по глубине: задние первыми)
    const approach = getHeroApproach(perfNow, tier);

    // Подсветка объектов: микрофон подсвечивается когда герой у него
    for (const obj of floorObjects) {
      if (obj.kind === "mic") obj.lit = approach.atMic;
      if (obj.kind === "piano" && !approach.atMic && approach.offsetX < -4) obj.lit = true;
      if (obj.kind === "speaker" && approach.singing) obj.lit = true;
      else if (obj.kind !== "mic" && obj.kind !== "piano" && obj.kind !== "speaker") obj.lit = false;
    }

    // Сортируем объекты: чем больше gy, тем ближе (рисуется позже)
    const sorted = [...floorObjects].sort((a, b) => (a.gx + a.gy) - (b.gx + b.gy));

    // Рисуем задние объекты
    for (const obj of sorted) {
      if (obj.gx + obj.gy < 0) drawFloorObject(obj.gx, obj.gy, obj.kind, pal, obj.lit);
    }

    // 4. Персонаж
    const cx = 30 + approach.offsetX;
    let bob = Math.round(Math.sin(perfNow / 320) * 1.2);
    const jumping = perfNow < jumpUntil;
    if (jumping) bob -= Math.round(Math.abs(Math.sin(perfNow / 90)) * 5);
    const singing = approach.singing || (mood !== "sad") || d.event === "lesson_done" || d.event === "level_up";
    drawChar(cx, bob, gender, top, bot, mood, singing, forcedSad, acc);

    // Эмоция над головой
    const emoType = emotionFor(mood, approach, perfNow);
    const headTop = (gender === "girl") ? 16 + bob : 8 + bob;
    // показываем эмоцию не всегда, а с пульсацией
    if (Math.floor(perfNow / 500) % 3 !== 0) {
      drawEmotion(cx, headTop, emoType, perfNow);
    }

    // 5. Передние объекты (рисуются поверх персонажа)
    for (const obj of sorted) {
      if (obj.gx + obj.gy >= 0 && obj.kind !== "rug") drawFloorObject(obj.gx, obj.gy, obj.kind, pal, obj.lit);
    }

    // 6. Частицы
    if (singing && approach.atMic) {
      noteTimer++;
      if (noteTimer % 22 === 0) spawnNote();
      maybeSing();
    }
    drawNotes();
    if (perfNow < starUntil) { if (stars.length === 0) spawnStars(cx); }
    drawStars();

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}

try {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.expand(); tg.ready();
    const cb = document.getElementById("closeBtn");
    cb.style.display = "block";
    cb.onclick = () => tg.close();
  }
} catch (e) {}

const nameInput = document.getElementById("nameInput");
nameInput.value = lsGet("vt_name", "Твой артист");
nameInput.addEventListener("input", () => {
  const n = nameInput.value;
  lsSet("vt_name", n);
  document.title = n || "Твой артист";
});

buildSwatches();
render();
</script>
